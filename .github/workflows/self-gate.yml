name: Self Gate

# The kit gates itself, the same way it asks adopters' repos to.
#
# There is deliberately NO top-level path filter. A check that skips the change
# in front of it is not a cheaper check, it is an absent one - and an absent
# check reads to a reviewer as "none required" rather than "none ran". (This
# is a lesson lifted from a preset that shipped a defect it could not see: a
# path filter left one file ungated, and a docs-only PR showed no checks at
# all.) Instead the expensive E2E job below ALWAYS runs to a green/red
# conclusion, but fast-passes docs-only changes inside the job (see
# "Detect code changes"). The check stays visible; only the minutes-long
# init/resolve/idempotency sequence is skipped.
#
# Two runners for the STATIC gates, because one is not enough. macOS's system
# bash is 3.2.57 - the only bash on a stock Mac - while GitHub's Linux runners
# have bash 5. A construct that parses on 5 but not 3.2 ships an installer that
# silently does nothing for every Mac user, and a Linux-only gate stays green
# throughout.
#
# The END-TO-END gate runs on Linux only. It exercises the specify CLI and file
# operations, not bash-version parsing, so a second macOS run repeats the same
# minutes-long init/resolve/idempotency sequence for no new signal. Bash
# compatibility stays covered on both runners by the static gate (which runs
# under each runner's default bash) plus the explicit /bin/bash -n step below.
# Measured: static gates take ~0.1s; the E2E section is effectively the whole
# build time, so running it twice doubles the build for nothing.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # macOS-only extra step: parse the installer with the SYSTEM bash, not the
      # one on PATH. On a GitHub macOS runner `bash` is Homebrew's 5.x, whereas
      # an adopter's Mac has 3.2.57 at /bin/bash - so the PATH bash cannot see
      # the bug this step exists to catch.
      - name: Parse installer under macOS system bash 3.2
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -1
          /bin/bash -n bin/speckit-init
          /bin/bash scripts/self-gate.sh --no-e2e
          echo "system bash parsed the installer and passed the static gate"

      - name: Static gate (no E2E)
        if: runner.os != 'macOS'
        run: bash scripts/self-gate.sh --no-e2e

  e2e-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1 >/dev/null 2>&1 || true
            CHANGED="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" 2>/dev/null || true)"
          elif [ -n "${GITHUB_BEFORE:-}" ] && [ "$GITHUB_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED="$(git diff --name-only "$GITHUB_BEFORE" HEAD 2>/dev/null || git show --name-only --pretty=format: HEAD)"
          else
            CHANGED="$(git diff --name-only HEAD~1..HEAD 2>/dev/null || git show --name-only --pretty=format: HEAD)"
          fi
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(bin/|preset/|skill/|scripts/|\.github/workflows/|\.specify/|\.opencode/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code change detected — full E2E will run."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs/evals-only change — E2E heavy steps will fast-pass."
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.changes.outputs.code == 'true'
        with:
          enable-cache: true

      - name: Cache specify CLI tool dir
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv/tools
            ~/.local/bin/specify
          key: ${{ runner.os }}-specify-cli-v1
          restore-keys: |
            ${{ runner.os }}-specify-cli-

      - name: Install specify CLI
        if: steps.changes.outputs.code == 'true'
        run: |
          command -v specify >/dev/null 2>&1 || uv tool install specify-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Self gate (full, incl. E2E)
        if: steps.changes.outputs.code == 'true'
        run: bash scripts/self-gate.sh

      - name: Fast-pass (docs-only, E2E not needed)
        if: steps.changes.outputs.code != 'true'
        run: |
          bash scripts/self-gate.sh --no-e2e
          echo "E2E skipped: no code paths changed (bin/, preset/, skill/, scripts/, workflows). Static gate passed; E2E remains green and visible."
